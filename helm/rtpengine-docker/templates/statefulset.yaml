apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.statefulset.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: rtpengine
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.statefulset.replicas }}
  serviceName: {{ .Values.service.headless.name }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: rtpengine
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: rtpengine
        release: {{ .Release.Name }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: rtpengine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_NICE
                - NET_ADMIN
                - NET_RAW
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INSTANCE_NAME
              value: {{ .Values.service.headless.name | quote }}
            - name: RTPENGINE_USER
              value: {{ .Values.rtpengine.user | quote }}
            - name: RTPENGINE_CONF_DIR
              value: {{ .Values.rtpengine.confDir | quote }}
            - name: RTPENGINE_LOG_DIR
              value: {{ .Values.rtpengine.logDir | quote }}
            - name: RTPENGINE_LOG_FILENAME
              value: {{ .Values.rtpengine.logFilename | quote }}
            - name: RTPENGINE_RECORDINGS_DIR
              value: {{ .Values.rtpengine.recordingsDir | quote }}
            - name: LISTEN_IP_EXTERNAL
              value: {{ .Values.rtpengine.listen.externalIP | quote }}
            - name: LISTEN_PORT_NG
              value: {{ .Values.rtpengine.listen.ngPort | quote }}
            - name: LISTEN_PORT_CLI
              value: {{ .Values.rtpengine.listen.cliPort | quote }}
            - name: LISTEN_PORT_HTTP
              value: {{ .Values.rtpengine.listen.httpPort | quote }}
            - name: MIN_PORT_DEFAULT_INTERFACE
              value: {{ .Values.rtpengine.defaultInterface.minPort | quote }}
            - name: MAX_PORT_DEFAULT_INTERFACE
              value: {{ .Values.rtpengine.defaultInterface.maxPort | quote }}
          ports:
            - containerPort: {{ .Values.rtpengine.listen.ngPort }}
            - containerPort: {{ .Values.rtpengine.listen.cliPort }}
            - containerPort: {{ .Values.rtpengine.listen.httpPort }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: log
              mountPath: {{ .Values.rtpengine.logDir }}
            - name: recordings
              mountPath: {{ .Values.rtpengine.recordingsDir }}
      volumes:
        - name: recordings
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-recordings-pvc
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: log
      spec:
        accessModes:
          - {{ .Values.persistence.accessMode }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
